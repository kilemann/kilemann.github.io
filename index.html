<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kilemannens apper</title>
<meta name="theme-color" content="#11161c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Kilemannens apper v1.3.0
   1.3.0  Hvert kort viser hvilken versjon appen har, hentet automatisk fra appens package.json
          (vises ikke hvis den ikke kan hentes). Automatiske tester lagt til
   1.2.1  Nytt brukernavn kilemann: app-lenker er nå relative (/app.io/),
          så de følger med hvis brukernavnet endres igjen
   1.2.0  La til Kronekikk med myntstabel-ikon
   1.1.2  Løpespiller har fått nytt navn: Lommespiller
   1.1.1  Løpespiller: kortet viser til nedlastingssiden
   1.1.0  La til Løpespiller med kassettikon
   1.0.0  Første versjon: kortrutenett med søk, teller og ikon per app */

/* Layout: tittel + søk på én linje, så et rutenett av kort med tykk kant og forskjøvet skygge */
:root{
  --bg:#e9ecef; --card:#f7f8f9; --ink:#14191f; --muted:#56616c;
  --edge:#14191f; --shadow:#1f4fa3; --hot:#e0401f; --badge:#f0c040;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1418; --card:#182027; --ink:#e8edf1; --muted:#93a1ad;
  --edge:#c9d3db; --shadow:#3f7fe8; --hot:#ff6a45; --badge:#f0c040; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.top{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
.top h1{margin:0;font:800 clamp(2rem,6vw,3rem)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.top h1 .count{color:var(--hot)}
.top p{margin:6px 0 0;color:var(--muted)}
.search{flex:0 1 340px;min-width:0}
@media (max-width:600px){.search{flex:1 1 100%}}
.search input{width:100%;font:1rem var(--body);padding:12px 14px;border:2px solid var(--edge);border-radius:0;
  background:var(--card);color:var(--ink)}
.search input:focus-visible{outline:3px solid var(--shadow);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 24px 22px;
  background:var(--card);border:2px solid var(--edge);color:inherit;text-decoration:none;
  box-shadow:8px 8px 0 var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--hot);outline:none}
.badge{width:60px;height:60px;border-radius:50%;background:var(--badge);display:grid;place-items:center;margin-bottom:8px}
.badge svg{width:32px;height:32px}
.card h2{margin:0;font:800 1.75rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.card p{margin:0;color:var(--muted);flex:1}
.card .open{margin-top:10px;font-weight:600;color:var(--hot)}
.card .ver{position:absolute;top:18px;right:20px;font:500 .75rem var(--mono);color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
footer{color:var(--muted);font:500 .8rem var(--mono)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Mine apper <span class="count" id="count">(0)</span></h1>
      <p>Små godbiter laget av Kilemannen.</p>
    </div>
    <label class="search">
      <input id="q" type="search" placeholder="Søk i apper…" aria-label="Søk i apper" autocomplete="off">
    </label>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Ingen apper passer søket.</p>

  <footer>Samleside v1.3.0</footer>
</main>

<script>
/* ============================================================
   LEGG TIL NYE APPER HER
   Kopier en blokk { ... }, lim den inn under de andre og endre teksten.
   url:  adressen til appen, f.eks. "/navn.io/" (= repo-navnet)
   icon: "sol", "fart", "kassett", "mynter" eller "stjerne"
   ============================================================ */
const APPS = [
  {
    name: "Himmelur",
    text: "Soloppgang, solnedgang, dagslengde og månefase for valgt by og dato.",
    url:  "/himmelur.io/",
    icon: "sol"
  },
  {
    name: "Størrelsen teller",
    text: "Måler størrelsen din.................på nettet.",
    url:  "/strteller.io/",
    icon: "fart"
  },
  {
    name: "Lommespiller",
    text: "Musikken din i lomma. Shuffle fra en mappe, styres med headset, ingen reklame og ingen nett.",
    url:  "/Runlikehell.io/",
    icon: "kassett"
  },
  {
    name: "Kronekikk",
    text: "Dagens valutakurser og ukens kundeaviser fra REMA, Extra, Europris og Rusta.",
    url:  "/kronesjekk.io/",
    icon: "mynter"
  },
];

/* ---------- Ikoner (mørkeblå på gul sirkel) ---------- */
const ICONS = {
  sol: `<svg viewBox="0 0 32 32" fill="none" stroke="#1f4fa3" stroke-width="2.4" stroke-linecap="round">
          <circle cx="13" cy="16" r="6" fill="#1f4fa3"/>
          <path d="M13 4v3M13 25v3M3 16h3M4.5 7.5l2 2M4.5 24.5l2-2M21.5 7.5l-2 2"/>
          <path d="M26 10a7 7 0 1 0 0 12a5.5 5.5 0 0 1 0-12z" fill="#1f4fa3" stroke="none"/>
        </svg>`,
  fart: `<svg viewBox="0 0 32 32" fill="none" stroke="#1f4fa3" stroke-width="2.6" stroke-linecap="round">
          <path d="M5 23a11 11 0 1 1 22 0"/>
          <path d="M16 23l6-8"/>
          <circle cx="16" cy="23" r="2.4" fill="#1f4fa3" stroke="none"/>
        </svg>`,
  kassett: `<svg viewBox="0 0 32 32" fill="none" stroke="#1f4fa3" stroke-width="2.2" stroke-linejoin="round">
          <rect x="2.5" y="6.5" width="27" height="19" rx="2.5"/>
          <rect x="7" y="10" width="18" height="7" rx="1.5"/>
          <circle cx="11.5" cy="13.5" r="1.8" fill="#1f4fa3" stroke="none"/>
          <circle cx="20.5" cy="13.5" r="1.8" fill="#1f4fa3" stroke="none"/>
          <path d="M9.5 25.5l1.8-3.8h9.4l1.8 3.8"/>
        </svg>`,
  mynter: `<svg viewBox="0 0 32 32" fill="none" stroke="#1f4fa3" stroke-width="1.9" stroke-linejoin="round">
          <path d="M3 7v15c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V7" fill="#f0c040"/>
          <path d="M3 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5M3 17c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>
          <ellipse cx="10" cy="7" rx="7" ry="2.5" fill="#1f4fa3"/>
          <path d="M15 17v8c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-8" fill="#f0c040"/>
          <path d="M15 21c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>
          <ellipse cx="22" cy="17" rx="7" ry="2.5" fill="#1f4fa3"/>
        </svg>`,
  stjerne: `<svg viewBox="0 0 32 32"><path d="M16 3l3.2 9.8L29 16l-9.8 3.2L16 29l-3.2-9.8L3 16l9.8-3.2z" fill="#1f4fa3"/></svg>`
};

/* ---------- Tegning og søk ---------- */
const grid = document.getElementById("grid"), q = document.getElementById("q");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function render(){
  const term = norm(q.value.trim());
  const list = APPS.filter(a => !term || norm(a.name + " " + a.text).includes(term));
  grid.innerHTML = list.map(a => `
    <a class="card" href="${esc(a.url)}">
      <div class="badge" aria-hidden="true">${ICONS[a.icon] || ICONS.stjerne}</div>
      ${versions[a.url] ? `<span class="ver" aria-label="Versjon ${esc(versions[a.url])}">v${esc(versions[a.url])}</span>` : ""}
      <h2>${esc(a.name)}</h2>
      <p>${esc(a.text)}</p>
      <span class="open">Åpne app ↗</span>
    </a>`).join("");
  document.getElementById("count").textContent = `(${list.length})`;
  document.getElementById("empty").hidden = list.length > 0;
}

/* ---------- Versjon per app ----------
   Hentes fra package.json i hver app, så tallet alltid er det som faktisk ligger ute.
   Kortene vises først; versjonene tegnes inn når de kommer. Feil gir bare ingen versjonstekst. */
const versions = {};
function lesVersjon(d){
  return d && typeof d.version === "string" && /^\d+\.\d+\.\d+$/.test(d.version) ? d.version : null;
}
async function hentVersjon(app){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try{
    const r = await fetch(app.url + "package.json", { cache: "no-cache", signal: ctl.signal });
    if (!r.ok) return;
    const v = lesVersjon(await r.json());
    if (v) versions[app.url] = v;
  }catch(e){ /* ingen versjon vises */ }
  finally{ clearTimeout(t); }
}
async function loadVersions(){
  await Promise.all(APPS.map(hentVersjon));
}

q.addEventListener("input", render);
render();
loadVersions().then(render);
</script>
</body>
</html>
